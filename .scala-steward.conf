pullRequests.frequency = "@monthly"

# steward reads the 2.13 literal as scala-library, which now publishes 3.x
# a pattern matches an artifactId exactly, and steward spells scala3-library two ways
updates.pin = [
  { groupId = "org.scala-lang", version = "2.12." },
  { groupId = "org.scala-lang", version = "2.13." },
  { groupId = "org.scala-lang", version = "3.3." },
  # scala-compiler 2.13 asks for the jdk8 classifier, and 4.x publishes jdk11
  { groupId = "org.jline", artifactId = "jline", version = "3." },
]
